<style>
@font-face{font-family:'Exo 2';src:url('../assets/fonts/exo2.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Exo 2';src:url('../assets/fonts/exo2-italic.woff2') format('woff2');font-weight:100 900;font-style:italic;font-display:swap}

@font-face{font-family:Rubik;src:url('../assets/fonts/rubik.woff2') format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:Fraunces;src:url('../assets/fonts/fraunces.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:Fraunces;src:url('../assets/fonts/fraunces-italic.woff2') format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
:root{
  /* Kleedkamer licht */
  --bg:#E6EEEE;--kaart:#FFFFFF;--kaart2:#F1F6F5;--rand:#C9D8D8;--tekst:#14302F;--zacht:#4E6566;--licht:#24403F;
  --accent:#1F5A63;--accent-d:#15393F;--op-accent:#FFFFFF;--geel:#9C6A00;--live:#2E7D4F;--fout:#C0392B;
  --knoprand:#B9CDCD;--f-tekst:Rubik,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--tekst);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.45}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* kop */
.kop{max-width:1000px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.merk{display:flex;align-items:center;gap:9px;color:var(--tekst);text-decoration:none;font-weight:900;font-size:22px;letter-spacing:-.02em;font-stretch:88%}
.merk .o1{fill:var(--tekst)}.merk .o2{fill:var(--bg)}
.module{font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--accent);border-left:1px solid var(--rand);padding-left:12px;text-decoration:none}
.kop .rechts{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--zacht);min-width:0}
.kop .rechts span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}

main{max-width:1000px;margin:0 auto;padding:6px 16px 60px}

/* bouwstenen */
.blok{background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:18px;min-width:0}
.blok + .blok{margin-top:14px}
.raster > .blok{margin-top:0}
.raster{display:grid;gap:14px}
.raster.twee{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.raster.drie{grid-template-columns:repeat(3,minmax(0,1fr))}
.blok.keuze{display:flex;flex-direction:column}
.uitleg{margin:40px calc(50% - 50vw) -60px;padding:40px 16px 48px;background:#F2EEE4;color:#0E2A2F}
.uitleg-in{max-width:968px;margin:0 auto}
.uitleg .klein{color:#4D6265}
.uitleg a{color:#C2512F}
.uitleg .stappen > div{border-top-color:#D5CDBC}
.uitleg .blok{box-shadow:0 10px 30px rgba(14,42,47,.18);color:var(--tekst)}
.uitleg .blok .klein{color:var(--zacht)}
.stappen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stappen > div{border-top:2px solid var(--rand);padding-top:12px}
.stappen b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--op-accent);font-weight:900;margin-bottom:8px}
.stappen h3{margin:0 0 4px}
.stappen p{margin:0}
.voorbeeld .vb-kaart{margin-top:12px;background:var(--kaart2);border:1px solid var(--rand);border-radius:12px;padding:14px;pointer-events:none}
.voorbeeld .vraag{font-weight:700;margin-bottom:8px}
.vb-select{border:1px solid var(--rand);border-radius:10px;padding:9px 12px;color:var(--licht)}
.blok.keuze .sub{flex:1}
.blok.keuze > .knop{align-self:flex-start}
h1.titel{font-family:Fraunces,Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 72;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:10px 0 6px}
h1.titel em{font-style:italic;color:var(--accent);font-weight:500}
h2{font-weight:900;font-stretch:80%;text-transform:uppercase;letter-spacing:.03em;font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px;font-weight:800}
.sub{color:var(--zacht);margin:0 0 14px}
.klein{font-size:13px;color:var(--zacht)}
.rij{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tussen{justify-content:space-between}
.stapel{display:flex;flex-direction:column;gap:10px}
hr{border:0;border-top:1px solid var(--rand);margin:16px 0}

.knop{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;color:var(--tekst);background:transparent;border:1.5px solid #3E6A71;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.knop:hover{border-color:var(--tekst)}
.knop.vol{background:var(--accent);border-color:var(--accent);color:var(--op-accent)}
.knop.vol:hover{background:var(--accent-d);border-color:var(--accent-d)}
.knop.klein{padding:5px 10px;font-size:13px;border-radius:8px}
.knop.gevaar{border-color:#6b3a3a;color:var(--fout)}
.knop.gevaar:hover{border-color:var(--fout)}
.knop:disabled{opacity:.5;cursor:default}
.knop.breed{width:100%}

label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--zacht);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--tekst);background:var(--kaart2);border:1px solid var(--rand);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.15);margin-top:3px}
input[type=color]{padding:3px}
.vink{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--licht);margin:12px 0;text-transform:none;letter-spacing:0;font-weight:500}
.velden{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--zacht);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid transparent}
.tabs a:hover{color:var(--tekst)}
.tabs a.aan{color:var(--op-accent);background:var(--accent)}
.tabs .teller{display:inline-block;background:var(--geel);color:#2a2400;border-radius:999px;font-size:11px;padding:0 6px;margin-left:5px}

.ploegkop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.ploegkop .naam{font-family:Fraunces,Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 100;font-size:28px;line-height:1.1}
.ploegkop .meta{color:var(--zacht);font-size:14px}
.terug{font-size:13px;color:var(--zacht);text-decoration:none}
.terug:hover{color:var(--tekst)}

/* lijsten */
.lijst{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--rand);min-width:0}
.item:last-child{border-bottom:0}
.item .hoofd{flex:1;min-width:0}
.item .hoofd b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.item{color:inherit;text-decoration:none;border-radius:8px}
a.item:hover{background:var(--kaart2)}
.nr{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--kaart2);border:1px solid var(--rand);font-weight:800;font-size:13px}
.label{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--kaart2);border:1px solid var(--rand);color:var(--zacht);white-space:nowrap}
.label.groen{color:var(--live);border-color:#2f6b57}
.label.geel{color:var(--geel);border-color:#6b5a2a}
.label.oranje{color:var(--accent);border-color:#7a4a3c}
.leeg{color:var(--zacht);text-align:center;padding:22px 10px}
.datum{width:56px;flex:none;text-align:center}
.datum b{display:block;font-size:18px;font-weight:900;line-height:1.1}

.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:28px;font-weight:700;letter-spacing:.2em;color:var(--geel);background:var(--kaart2);border:1px dashed #6b5a2a;border-radius:12px;padding:10px 16px;display:inline-block}

/* pills */
.pills,.kies{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--rand);background:var(--kaart2);color:var(--licht);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.pill.aan{background:var(--accent);border-color:var(--accent);color:var(--op-accent);font-weight:700}
span.pill{cursor:default}

/* scores */
.scores{display:grid;grid-template-columns:repeat(10,minmax(0,40px));gap:5px}
.scores button{min-width:0;height:36px;padding:0;border-radius:8px;border:1px solid var(--rand);background:var(--kaart2);font-weight:800;cursor:pointer}
.scores button.aan{background:var(--accent);border-color:var(--accent);color:var(--op-accent)}
.scores button:disabled{cursor:default}
.scores button:disabled:not(.aan){opacity:.55}
.evalvraag{padding:12px 0;border-bottom:1px dashed var(--rand)}
.evalvraag:last-child{border-bottom:0}
.evalvraag .vraag{font-weight:700;margin-bottom:8px}
.evalvraag textarea{min-height:52px;margin-top:8px}
.evalsectie{margin-top:14px}
.evalsectie > h3{color:var(--accent);text-transform:uppercase;font-size:13px;letter-spacing:.06em;font-weight:900;font-stretch:85%}

/* opstelling */
.groepen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.groep{border:1px solid var(--rand);border-radius:12px;padding:12px;background:var(--kaart2);min-width:0}
.groep h3{display:flex;align-items:center;gap:8px}
.stip{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pill.elders{opacity:.35}
.pill.weg{text-decoration:line-through}

/* kalender */
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.kal .dag{padding:8px 0;border-radius:8px;background:var(--kaart2);border:1px solid var(--rand);cursor:pointer;user-select:none}
.kal .dag.weg{background:#5a2f2f;border-color:#8a4242;color:#ffd9d9}
.kal .dag.voorbij{opacity:.35;cursor:default}
.kal .kop7{color:var(--zacht);font-size:11px;font-weight:800;text-transform:uppercase}

/* tabel */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rand);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--zacht);white-space:nowrap}
.tabelwrap{overflow-x:auto}

.cijfers{display:flex;gap:22px;flex-wrap:wrap}
.wie{font-weight:700;color:#2F7A84;font-size:14px}
.ovz th,.ovz td{text-align:center;padding:8px 6px}
.ovz tbody tr{cursor:pointer}
.ovz tbody tr:hover{background:var(--kaart2)}
.legende{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--zacht)}
.balkrij{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.balkrij[onclick]{cursor:pointer}
.balkrij .rang{width:20px;text-align:center;color:var(--zacht);font-size:12px;font-weight:700}
.balkrij .nm{flex:0 0 150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.balk{flex:1;height:8px;background:var(--kaart2);border:1px solid var(--rand);border-radius:99px;overflow:hidden}
.balk i{display:block;height:100%;border-radius:99px}
.zelfgem b{font-size:22px}

.cijfers b{display:block;font-size:26px;font-weight:900;line-height:1.1}

.melding{background:var(--kaart2);border:1px solid var(--rand);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.melding.geel{border-left-color:var(--geel)}
.bericht{padding:12px 0;border-bottom:1px solid var(--rand)}
.bericht:last-child{border-bottom:0}
.bericht .wanneer{font-size:12px;color:var(--zacht)}
.bericht p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}


/* Lichte, rustige stijl voor de evaluaties (leesbaar, niet vermoeiend) */
.licht{--kaart:#FBF9F5;--kaart2:#FFFFFF;--rand:#E3DDD1;--tekst:#1F2A2C;--zacht:#6B7275;--licht:#2E3A3D;--accent:#E8714F;--accent-d:#D65F3D;--op-accent:#FFFFFF;--live:#2E7D4F;--geel:#9A6B00;color:var(--tekst)}
.licht.blok,.licht .blok{background:var(--kaart);border-color:var(--rand)}
.licht .scores button{background:#fff;border-color:#D9D2C4;color:#2E3A3D}
.licht .scores button:hover:not(:disabled){border-color:#9C9384}
.licht .scores button.aan{background:var(--accent);border-color:var(--accent);color:#fff}
.licht .pill{background:#fff;border-color:#D9D2C4;color:#2E3A3D}
.licht .pill.aan{background:var(--accent);border-color:var(--accent);color:#fff}
.licht input,.licht select,.licht textarea{background:#fff;border-color:#D9D2C4;color:var(--tekst)}
.licht .evalvraag{border-bottom-color:#E8E2D6}
.licht .evalsectie > h3{color:#C2512F}
.licht .knop{border-color:#C9C1B2;color:var(--tekst)}
.licht .knop:hover{border-color:var(--tekst)}
.licht .knop.vol{color:#fff}
.licht .label{background:#F1ECE3;border-color:#DDD5C7;color:#5F666A}
.licht .label.groen{color:#2E7D4F;border-color:#B9D8C3;background:#EEF7F0}
.licht .label.geel{color:#8A5F00;border-color:#E6D3A3;background:#FBF4E2}
.licht .label.oranje{color:#B5482A;border-color:#EDC3B4;background:#FCEFEA}
.licht th{color:#7A7F82}
.licht th,.licht td{border-bottom-color:#E8E2D6}
.licht hr{border-top-color:#E3DDD1}
.licht a{color:#C2512F}

/* Mijn ploegen: ploeg als duidelijke tegel, de rest op de achtergrond */
.ploegtegels{display:grid;gap:14px}
.ploegtegel{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:22px 24px;border-radius:18px;
  background:#1D4A52;border:1.5px solid #3C7A84;border-left:6px solid var(--accent);color:var(--tekst);text-decoration:none;
  box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .15s,border-color .15s,box-shadow .15s}
.ploegtegel:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.ploegtegel .embleem{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--op-accent);
  font-weight:900;font-stretch:80%;font-size:22px;letter-spacing:.02em;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.ploegtegel .naam{font-family:Fraunces,Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 72;font-size:30px;line-height:1.05}
.ploegtegel .meta{color:#C3D6D8;font-size:15px;margin-top:4px}
.ploegtegel .rechts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ploegtegel.wacht{border-left-color:var(--geel);opacity:.85}
.ploegtegel.wacht .embleem{background:#3A5A5F;color:var(--geel)}
.bijzaak{margin-top:26px;padding:16px 18px;border:1px dashed var(--rand);border-radius:14px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;color:var(--zacht);font-size:14px}
.bijzaak form{display:flex;gap:8px;align-items:center}
.bijzaak input{width:150px;padding:7px 10px;font-size:14px}
@media (max-width:600px){
  .ploegtegel{grid-template-columns:auto 1fr;gap:14px;padding:18px}
  .ploegtegel .rechts{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .ploegtegel .embleem{width:52px;height:52px;font-size:18px}
  .ploegtegel .naam{font-size:24px}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--tekst);color:var(--bg);font-weight:700;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .25s;z-index:50;max-width:calc(100% - 32px)}
#toast.zicht{transform:translateX(-50%) translateY(0);visibility:visible}
#toast:not(.zicht){visibility:hidden;transition:transform .25s,visibility 0s .25s}
#toast.fout{background:var(--fout);color:#2a0000}

.laden{color:var(--zacht);padding:30px 0;text-align:center}

@media (max-width:900px){.stappen{grid-template-columns:repeat(2,minmax(0,1fr))}.raster.drie{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.raster.drie > .blok:first-child{grid-column:1/-1}}
@media (max-width:700px){
  .raster.twee,.raster.drie,.velden{grid-template-columns:minmax(0,1fr)}
  .stappen{grid-template-columns:minmax(0,1fr)}
  .kop .rechts span{display:none}
  .module{display:none}
  .blok{padding:15px}
}

/* ===== Kleedkamer licht: alles rustig, licht en goed leesbaar ===== */
body{font-family:var(--f-tekst)}
h1.titel,.ploegkop .naam,.ploegtegel .naam{font-family:var(--f-tekst);font-variation-settings:normal;font-weight:700;letter-spacing:-.01em}
h1.titel em{color:var(--accent)}
h2,.module,.evalsectie > h3,.merk{font-family:var(--f-tekst);font-stretch:100%}
h2{font-size:15px;letter-spacing:.06em}
.blok{box-shadow:0 1px 4px rgba(14,42,47,.06)}
.knop{border-color:var(--knoprand);color:var(--tekst)}
.knop.vol{color:var(--op-accent)}
.knop.gevaar{border-color:#EBC1BC;color:var(--fout)}
.knop.gevaar:hover{border-color:var(--fout)}
.tabs a{color:var(--zacht)}
.tabs a.aan{color:var(--op-accent);background:var(--accent)}
.tabs .teller{background:#F4C95D;color:#3A2C00}
.label{background:var(--kaart2);border-color:var(--rand);color:var(--zacht)}
.label.groen{color:#2E7D4F;border-color:#BFDCC8;background:#EEF7F1}
.label.geel{color:#8A5F00;border-color:#E8D5A6;background:#FBF5E4}
.label.oranje{color:#15393F;border-color:#B5D0CF;background:#EAF3F2}
.code{color:#15393F;border-color:#B5D0CF;background:#F0F6F5}
.melding{background:#fff}
.kal .dag{background:#fff}
.kal .dag.weg{background:#FDE8E6;border-color:#EDB2AB;color:#9B2C22}
.ploegtegel{background:#fff;border-color:var(--rand);border-left-color:var(--accent);box-shadow:0 8px 24px rgba(14,42,47,.10)}
.ploegtegel:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(14,42,47,.14)}
.ploegtegel .meta{color:var(--zacht)}
.ploegtegel .embleem{color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.ploegtegel.wacht{border-left-color:#E0B341}
.ploegtegel.wacht .embleem{background:#E6EDF5;color:#8A5F00}
.uitleg{background:#D6E4E3;color:var(--tekst)}
.uitleg .klein{color:var(--zacht)}

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));

const DAGEN = ["zo","ma","di","wo","do","vr","za"];

  if (!d) return "";

  return kort ? x.getDate() + " " + MAANDEN[x.getMonth()].slice(0, 3) : DAGEN[x.getDay()] + " " + x.getDate() + " " + MAANDEN[x.getMonth()] + " " + x.getFullYear();

function maakRandTransparant(c) {
  // Witte (of bijna witte) achtergrond die aan de rand raakt wordt doorzichtig, daarna bijsnijden tot het logo.
  const cx = c.getContext("2d"), W = c.width, H = c.height, im = cx.getImageData(0, 0, W, H), d = im.data;
  const wit = i => d[i + 3] > 200 && d[i] > 232 && d[i + 1] > 232 && d[i + 2] > 232;
  const hoeken = [0, (W - 1) * 4, (H - 1) * W * 4, ((H - 1) * W + W - 1) * 4];
  if (hoeken.filter(wit).length >= 3) {
    const gezien = new Uint8Array(W * H), stapel = [];
    for (let x = 0; x < W; x++) { stapel.push(x, (H - 1) * W + x); }
    for (let y = 0; y < H; y++) { stapel.push(y * W, y * W + W - 1); }
    while (stapel.length) {
      const p = stapel.pop(); if (gezien[p]) continue; gezien[p] = 1;
      if (!wit(p * 4)) continue;
      d[p * 4 + 3] = 0;
      const x = p % W, y = (p / W) | 0;
      if (x > 0) stapel.push(p - 1); if (x < W - 1) stapel.push(p + 1);
      if (y > 0) stapel.push(p - W); if (y < H - 1) stapel.push(p + W);
    }
  }
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  cx.putImageData(im, 0, 0);
  if (x1 < 0) return;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, uit = cx.getImageData(x0, y0, w, h);
  c.width = w; c.height = h; c.getContext("2d").putImageData(uit, 0, 0);
}

}

function vertaalFout(m) {
  if (/Invalid login credentials/i.test(m)) return "E-mailadres of wachtwoord klopt niet";

  if (/Failed to fetch|NetworkError/i.test(m)) return "Geen verbinding. Probeer opnieuw.";
  return m;
}

  } catch (e) {
    foutMelding(e);
    app().innerHTML = '<div class="blok leeg">Er ging iets mis bij het laden. <a href="#/">Terug</a></div>';

}

/* =====================================================================
   PLOEG
   ===================================================================== */
async function laadPloeg(id) {
  const lid = await q(sb.from("cs_leden").select("*").eq("ploeg_id", id).eq("user_id", sessie.user.id).maybeSingle());
  if (!lid) return null;
  const ploeg = await q(sb.from("cs_ploegen").select("*").eq("id", id).maybeSingle());
  if (!ploeg) return null;
  const ctx = { id, ploeg, lid, coach: lid.status === "actief" && lid.rol === "coach", actief: lid.status === "actief" };
  if (!ctx.actief) return ctx;
  const [spelers, wedstrijden] = await Promise.all([
    q(sb.from("cs_spelers").select("*").eq("ploeg_id", id).order("voornaam").order("naam")),
    q(sb.from("cs_wedstrijden").select("*").eq("ploeg_id", id).order("datum", { ascending: false }))
  ]);
  Object.assign(ctx, { spelers, wedstrijden });
  ctx.spelerMap = Object.fromEntries(spelers.map(s => [s.id, s]));
  if (ctx.coach) {
    const [leden, profielen] = await Promise.all([
      q(sb.from("cs_leden").select("*").eq("ploeg_id", id).order("created_at")),
      q(sb.from("cs_speler_profiel").select("speler_id,data").eq("ploeg_id", id))
    ]);
    ctx.leden = leden;
    ctx.profielen = Object.fromEntries(profielen.map(p => [p.speler_id, p.data || {}]));
  }
  return ctx;
}

async function vPloeg(id, tab, sub, sub2) {
  if (!P || P.id !== id || P._verouderd) {
    if (!P || P.id !== id) app().innerHTML = '<div class="laden">Laden…</div>';
    P = await laadPloeg(id);
  }
  if (!P) { app().innerHTML = '<div class="blok leeg">Deze ploeg bestaat niet of je hebt er geen toegang toe. <a href="#/">Terug</a></div>'; return; }

function vCoach(tab, sub, sub2) {

  const views = { home: cHome, overzicht: cOverzicht, spelers: cSpelers, wedstrijden: cWedstrijden, instellingen: cInstellingen };
  return (views[tab] || cHome)(kop, sub, sub2);
}

async function cHome(kop) {
  const wacht = P.leden.filter(l => l.status === "wacht");

  if (laatste) {
    try {
      const ev = await q(sb.from("cs_evaluaties").select("speler_id").eq("wedstrijd_id", laatste.id).eq("ingediend", true));
      const el = $("#eval-teller"); if (el) el.textContent = datumMooi(laatste.datum) + " · " + ev.length + " van " + opgesteld(laatste).length + " ingediend";
    } catch (e) { console.warn(e); }
  }
}

/* ---------- overzicht: alle spelers in één oogopslag (zoals het KSK-beheer) ---------- */
const scoreKleur = v => v == null ? "var(--zacht)" : v >= 9 ? "#1E7A45" : v >= 7 ? "#3FA36B" : v >= 6 ? "#D9822B" : "var(--fout)";
const pctKleur = p => p >= 100 ? "#1E7A45" : p >= 70 ? "#3FA36B" : p >= 40 ? "#D9822B" : "var(--fout)";
const gem = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const getal = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
async function cOverzicht(kop) {
  app().innerHTML = kop + '<div class="laden">Laden…</div>';
  const evals = await q(sb.from("cs_evaluaties").select("wedstrijd_id,speler_id,ratings,motm,weak_link,antwoorden,ingediend").eq("ploeg_id", P.id));
  const nu = vandaag();
  const gespeeldeW = P.wedstrijden.filter(w => w.datum <= nu);
  const spelers = P.spelers.filter(s => s.actief).sort((a, b) => naamVan(a).localeCompare(naamVan(b)));
  const wl = P.ploeg.weak_link_aan;

  // per speler: gespeeld, eigen gemiddelde, score van ploegmaats, motm, weak link, invulgraad
  const rij = spelers.map(s => {
    const wIds = gespeeldeW.filter(w => opgesteld(w).includes(s.id)).map(w => w.id);
    const eigen = evals.filter(e => e.speler_id === s.id && e.ingediend);
    const eigenScores = [];
    eigen.forEach(e => Object.entries(e.antwoorden || {}).forEach(([k, v]) => { if (/^(eigen_|k_)/.test(k) && !/_opm$/.test(k)) { const n = getal(v); if (n != null) eigenScores.push(n); } }));
    const peer = []; let motm = 0, weak = 0;
    evals.forEach(e => { if (e.speler_id === s.id) return; const n = getal((e.ratings || {})[s.id]); if (n != null) peer.push(n); if (e.motm === s.id) motm++; if (e.weak_link === s.id) weak++; });
    const ingevuld = new Set(eigen.map(e => e.wedstrijd_id).filter(id => wIds.includes(id))).size;
    return { s, gespeeld: wIds.length, eigen: gem(eigenScores), peer: gem(peer), peerN: peer.length, motm, weak, ingevuld, pct: wIds.length ? Math.round(ingevuld / wIds.length * 100) : null };
  });
  const cijfer = v => v == null ? '<span class="klein">—</span>' : `<b style="color:${scoreKleur(v)}">${v.toFixed(1)}</b>`;
  const tabel = `<div class="tabelwrap"><table class="ovz">
    <thead><tr><th style="text-align:left">Speler</th><th title="Wedstrijden in de opstelling">Gespeeld</th><th title="Gemiddelde van de eigen scores">Ø Eigen</th><th title="Gemiddelde score van ploegmaats">Ø Ploegmaats</th><th title="Speler van de match">⭐ MOTM</th>${wl ? '<th title="Weak link">🔴 W. link</th>' : ""}</tr></thead>
    <tbody>${rij.map(r => `<tr onclick="ga('#/p/${P.id}/spelers/${r.s.id}')">
      <td style="text-align:left"><b>${esc(naamVan(r.s))}</b>${r.s.is_keeper ? " 🧤" : ""}</td>
      <td>${r.gespeeld || '<span class="klein">—</span>'}</td>
      <td>${cijfer(r.eigen)}</td>
      <td>${cijfer(r.peer)}${r.peerN ? `<div class="klein">${r.peerN}×</div>` : ""}</td>
      <td>${r.motm ? `<b style="color:#1E7A45">${r.motm}</b>` : '<span class="klein">—</span>'}</td>
      ${wl ? `<td>${r.weak ? `<b style="color:var(--fout)">${r.weak}</b>` : '<span class="klein">—</span>'}</td>` : ""}
    </tr>`).join("")}</tbody></table></div>
    <div class="legende"><span>Ø score:</span><span style="color:var(--fout)">● 1-5</span><span style="color:#D9822B">● 6</span><span style="color:#3FA36B">● 7-8</span><span style="color:#1E7A45">● 9-10</span></div>`;

  // invulgraad evaluaties (ranglijst)
  const rang = rij.filter(r => r.gespeeld).sort((a, b) => (b.pct - a.pct) || naamVan(a.s).localeCompare(naamVan(b.s)));
  const totI = rang.reduce((t, r) => t + r.ingevuld, 0), totG = rang.reduce((t, r) => t + r.gespeeld, 0);
  const teamPct = totG ? Math.round(totI / totG * 100) : 0;
  const balk = (pct, kleur) => `<div class="balk"><i style="width:${pct}%;background:${kleur}"></i></div>`;
  const invul = rang.length ? rang.map((r, i) => `<div class="balkrij" onclick="ga('#/p/${P.id}/spelers/${r.s.id}')"><span class="rang">${i + 1}</span><span class="nm">${esc(naamVan(r.s))}</span>${balk(r.pct, pctKleur(r.pct))}<b style="color:${pctKleur(r.pct)};width:42px;text-align:right">${r.pct}%</b><span class="klein" style="width:40px;text-align:right">${r.ingevuld}/${r.gespeeld}</span></div>`).join("")
    + `<div class="rij tussen" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--rand)"><span class="klein">Team totaal</span><b style="color:${pctKleur(teamPct)}">${teamPct}% <span class="klein">(${totI}/${totG})</span></b></div>`
    : '<p class="sub" style="margin:0">Nog geen gespeelde wedstrijden met opstelling.</p>';

  // zelfbeoordeling + sterke/werkpunten uit de voetbalfiches
  const fiches = spelers.map(s => P.profielen[s.id] || {});
  const zelf = ZELF.map(([k, t]) => { const v = gem(fiches.map(d => getal(d[k])).filter(n => n != null)); return `<div><b style="color:${scoreKleur(v)}">${v == null ? "—" : v.toFixed(1) + "/10"}</b><span class="klein">${t}</span></div>`; }).join("");
  const veld = new Set(Object.values(CATS).flat()); const keeperOnly = new Set(Object.values(CATS_KEEPER).flat().filter(v => !veld.has(v)));
  const telPunten = soort => {
    const n = {}; Object.keys(CATS).forEach(c => [...CATS[c], ...(CATS_KEEPER[c] || [])].forEach(v => { n[v] = 0; }));
    fiches.forEach(d => Object.values(d[soort] || {}).flat().forEach(v => { n[v] = (n[v] || 0) + 1; }));
    return Object.entries(n).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  };
  const puntenBlok = (soort, titel, kleur) => {
    const lijst = telPunten(soort); const max = (lijst[0] && lijst[0][1]) || 1;
    const regel = ([l, c]) => `<div class="balkrij"><span class="nm" style="${keeperOnly.has(l) ? "color:var(--accent-d)" : ""}">${esc(l)}${keeperOnly.has(l) ? " 🧤" : ""}</span>${balk(Math.round(c / max * 100), keeperOnly.has(l) ? "var(--accent)" : kleur)}<b style="color:${c ? kleur : "var(--zacht)"};width:30px;text-align:right">${c}×</b></div>`;
    const met = lijst.filter(x => x[1]), zonder = lijst.filter(x => !x[1]);
    return `<div class="blok"><h2>${titel}</h2>${met.length ? met.map(regel).join("") : '<p class="sub" style="margin:0">Nog geen fiches ingevuld.</p>'}
      ${zonder.length ? `<details style="margin-top:8px"><summary class="klein" style="cursor:pointer">Nooit gekozen (${zonder.length})</summary>${zonder.map(regel).join("")}</details>` : ""}</div>`;
  };

  app().innerHTML = kop + `
  <div class="blok"><div class="rij tussen"><h2 style="margin:0">Alle spelers</h2><span class="klein">Klik op een speler voor het detail</span></div>${tabel}</div>
  <div class="raster twee" style="margin-top:14px">
    <div class="blok"><h2>📋 Evaluaties ingevuld</h2>${invul}</div>
    <div class="blok"><h2>🔍 Zelfbeoordeling team gemiddeld</h2><div class="cijfers zelfgem">${zelf}</div>
      <p class="sub" style="margin:12px 0 0">${fiches.filter(ficheIngevuld).length} van ${spelers.length} spelers hebben hun voetbalfiche ingevuld.</p></div>
  </div>
  <div class="raster twee" style="margin-top:14px">
    ${puntenBlok("sterk", "🌟 Meest genoemde sterke punten", "#1E7A45")}
    ${puntenBlok("werk", "📈 Meest genoemde werkpunten", "var(--fout)")}
  </div>`;
}

/* ---------- spelers ---------- */
function cSpelers(kop, sub) {
  if (sub) return cSpelerDetail(kop, sub);

      setTimeout(() => { const v = document.querySelector("#nsp input[name=voornaam]"); if (v) v.focus(); }, 300);

}

function leesGegevens(basis) { const g = Object.assign({}, basis || {}); document.querySelectorAll("[data-geg]").forEach(el => { const v = el.value.trim(); if (v) g[el.dataset.geg] = v; else delete g[el.dataset.geg]; }); return g; }

  const tekst = k => d[k] ? `<div style="margin-bottom:10px"><div class="klein">${VOETBAL_TEKST[k]}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(d[k])}</div></div>` : "";
  const weg = (d.afwezig || []).filter(x => x >= vandaag()).sort();
  return `<div class="raster twee">
    <div>
      <h3>Basisinfo</h3>
      <div class="klein">Favoriete positie</div>${pills(d.pos_fav)}
      <div class="klein" style="margin-top:8px">Meest gespeelde positie</div>${pills(d.pos_meest)}
      <div class="klein" style="margin-top:8px">Voorkeurspoot</div><div>${esc(d.voet || "–")}</div>
      <h3 style="margin-top:16px">Zelfbeoordeling</h3>
      <table>${ZELF.map(([k, t]) => `<tr><td>${t}</td><td style="text-align:right"><b>${d[k] || "–"}</b></td></tr>`).join("")}</table>
      <h3 style="margin-top:16px">Sterke punten</h3>${pills(Object.values(d.sterk || {}).flat())}
      <h3 style="margin-top:12px">Werkpunten</h3>${pills(Object.values(d.werk || {}).flat())}
      <h3 style="margin-top:12px">Niet beschikbaar</h3>${weg.length ? pills(weg.map(x => datumMooi(x, true))) : '<span class="klein">Geen data doorgegeven.</span>'}
    </div>
    <div>${Object.keys(VOETBAL_TEKST).map(tekst).join("") || '<p class="klein">Geen antwoorden.</p>'}</div>
  </div>`;
}

/* ---------- wedstrijden ---------- */
function cWedstrijden(kop, sub, sub2) {
  if (sub === "nieuw") return cWedstrijdFormulier(kop, null);
  if (sub && sub2 === "bewerk") return cWedstrijdFormulier(kop, P.wedstrijden.find(w => w.id === sub));

  if (sub) return cWedstrijdDetail(kop, sub);
  const nu = vandaag();
  const komend = P.wedstrijden.filter(w => w.datum >= nu).sort((a, b) => a.datum.localeCompare(b.datum));
  const voorbij = P.wedstrijden.filter(w => w.datum < nu);
  const rij = w => {
    const aantal = opgesteld(w).length;
    return `<a class="item" href="#/p/${P.id}/wedstrijden/${w.id}">${datumBlok(w.datum)}
      <div class="hoofd"><b>${esc(w.tegenstander)}</b><span class="klein">${w.thuis_uit} · ${aantal ? aantal + " opgesteld" : "nog geen opstelling"}</span></div>

  <div class="blok">

}

    } catch (err) { foutMelding(err); }
  };
}

function cWedstrijdDetail(kop, wid) {
  const w = P.wedstrijden.find(x => x.id === wid);
  if (!w) { app().innerHTML = kop + '<div class="blok leeg">Wedstrijd niet gevonden.</div>'; return; }
  const groepen = P.ploeg.groepen || [];

  const ingedeeld = new Set(Object.values(opst).flat());
  const actief = P.spelers.filter(s => s.actief || ingedeeld.has(s.id));
  const weg = new Set(actief.filter(s => ((P.profielen[s.id] || {}).afwezig || []).includes(w.datum)).map(s => s.id));
  const groepHtml = groepen.map(g => {
    const ids = opst[g.id] || [];
    const sc = (w.scores || {})[g.id] || {};
    return `<div class="groep" data-g="${esc(g.id)}">
      <h3><span class="stip" style="background:${esc(g.kleur || "#ccc")}"></span>${esc(g.naam)} <span class="klein teller-g" style="margin-left:auto">${ids.length}</span></h3>
      <div class="kies">${actief.map(s => {
        const aan = ids.includes(s.id), elders = !aan && ingedeeld.has(s.id);
        return `<button type="button" class="pill ${aan ? "aan" : ""} ${elders ? "elders" : ""} ${weg.has(s.id) ? "weg" : ""}" data-s="${s.id}" onclick="A.opstelKlik(this)">${esc(kortNaam(s))}${s.is_keeper ? " 🧤" : ""}</button>`;
      }).join("") || '<span class="klein">Voeg eerst spelers toe.</span>'}</div>
      <div class="rij" style="margin-top:10px"><span class="klein">Uitslag</span>
        <input type="number" min="0" max="99" class="sc-wij" value="${sc.wij ?? ""}" placeholder="wij" style="width:70px" aria-label="Doelpunten ${esc(g.naam)}">
        <span>–</span><input type="number" min="0" max="99" class="sc-zij" value="${sc.zij ?? ""}" placeholder="zij" style="width:70px" aria-label="Doelpunten tegenstander"></div>
    </div>`;
  }).join("");
  app().innerHTML = kop + `
  <a class="terug" href="#/p/${P.id}/wedstrijden">← Alle wedstrijden</a>
  <div class="blok" style="margin-top:10px">
    <div class="rij tussen">
      <div><h2 style="margin:0">${esc(w.tegenstander)} <span class="label">${w.thuis_uit}</span></h2><div class="klein">${datumMooi(w.datum)}</div></div>
      <div class="rij"><a class="knop klein" href="#/p/${P.id}/wedstrijden/${w.id}/bewerk">Bewerken</a>
      <a class="knop klein vol" href="#/p/${P.id}/wedstrijden/${w.id}/evaluaties">Evaluaties</a></div>
    </div>
  </div>
  <div class="blok">
    <h2>Opstelling${groepen.length > 1 ? " per groep" : ""}</h2>
    <p class="sub">Tik op een speler om hem in een groep te zetten. Wie opgesteld staat, kan na de match de evaluatie invullen.</p>
    ${weg.size ? `<p class="klein" style="margin:-6px 0 12px">⚠️ Niet beschikbaar volgens de kalender: <b>${[...weg].map(id => esc(kortNaam(P.spelerMap[id]))).join(", ")}</b></p>` : ""}
    <div class="groepen" id="opst">${groepHtml}</div>
    <label class="vink"><input type="checkbox" id="evalopen" ${w.eval_open ? "checked" : ""}> Spelers mogen deze wedstrijd evalueren</label>
    <button class="knop vol" onclick="A.opstellingBewaar('${w.id}')">Opstelling en uitslag opslaan</button>

}

/* ---------- evaluaties (coach) ---------- */
const EVAL_LABELS = {
  eigen_mentaliteit: "Mentaliteit", eigen_bplus: "Balbezit (B+)", eigen_bmin: "Balverlies (B−)", eigen_t1: "Omschakelen B+ → B−", eigen_t2: "Omschakelen B− → B+",
  k_doellijn: "Doellijn en reflexen", k_1v1: "1 tegen 1 en uitkomen", k_communicatie: "Coachen en communiceren", k_opbouw: "Opbouw en uittrap", k_uitstraling: "Uitstraling",
  team_mentaliteit: "Mentaliteit van de ploeg", team_samenspel: "Samenspel"
};
async function cEvaluaties(kop, wid) {
  const w = P.wedstrijden.find(x => x.id === wid);
  if (!w) { app().innerHTML = kop + '<div class="blok leeg">Wedstrijd niet gevonden.</div>'; return; }
  app().innerHTML = kop + '<div class="laden">Laden…</div>';
  const evals = await q(sb.from("cs_evaluaties").select("*").eq("wedstrijd_id", wid));
  const ids = opgesteld(w);
  const perSpeler = Object.fromEntries(evals.map(e => [e.speler_id, e]));
  const ontv = {}, motm = {}, wl = {};
  evals.forEach(e => {
    Object.entries(e.ratings || {}).forEach(([id, r]) => (ontv[id] = ontv[id] || []).push(r));
    if (e.motm) motm[e.motm] = (motm[e.motm] || 0) + 1;
    if (e.weak_link) wl[e.weak_link] = (wl[e.weak_link] || 0) + 1;
  });
  const sorteer = id => ontv[id] && ontv[id].length ? Number(gemiddelde(ontv[id])) : -1;
  const eigenGem = e => { if (!e || !e.ingediend) return "–"; const v = Object.entries(e.antwoorden || {}).filter(([k]) => /^(eigen_|k_)/.test(k) && !/_opm$/.test(k)).map(([, x]) => parseFloat(x)).filter(n => !isNaN(n)); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) : "–"; };
  const rijen = ids.map(id => P.spelerMap[id]).filter(Boolean)
    .sort((a, b) => sorteer(b.id) - sorteer(a.id))
    .map(s => {
      const e = perSpeler[s.id], a = (e && e.antwoorden) || {};
      return `<tr>
        <td><b style="color:${e && e.ingediend ? "#1E7A45" : "var(--fout)"}" title="${e && e.ingediend ? "Ingediend" : e ? "Nog niet ingediend (concept)" : "Nog niet ingevuld"}">${esc(naamVan(s))}</b>${e && !e.ingediend ? ' <span class="klein">concept</span>' : ""}</td>
        <td><b>${gemiddelde(ontv[s.id])}</b> <span class="klein">(${(ontv[s.id] || []).length})</span></td>
        <td><b>${eigenGem(e)}</b></td>
        <td>${motm[s.id] ? "⭐ " + motm[s.id] : ""}</td>
        ${P.ploeg.weak_link_aan ? `<td>${wl[s.id] || ""}</td>` : ""}
        <td>${e ? `<button class="knop klein" onclick="A.toonEval('${s.id}')">Bekijk</button>` : ""}</td></tr>`;
    }).join("");
  const tel = k => gemiddelde(evals.map(e => e.antwoorden && Number(e.antwoorden[k])).filter(Boolean));
  const systemen = {}; evals.forEach(e => { const s = e.antwoorden && e.antwoorden.teg_systeem; if (s) systemen[s] = (systemen[s] || 0) + 1; });
  const tegTekst = evals.map(e => [e.speler_id, e.antwoorden || {}]).filter(([, a]) => a.teg_beste || a.teg_extra);
  const waarom = evals.map(e => [e.speler_id, e.antwoorden && e.antwoorden.team_waarom]).filter(x => x[1]);
  window._evals = { evals, w };
  app().innerHTML = kop + `
  <a class="terug" href="#/p/${P.id}/wedstrijden/${w.id}">← ${esc(w.tegenstander)}</a>
  <div class="licht">
  <div class="blok" style="margin-top:10px">
    <div class="rij tussen"><h2 style="margin:0">Evaluaties · ${esc(w.tegenstander)}</h2>
    <span class="klein">${evals.filter(e => e.ingediend).length} van ${ids.length} ingediend</span></div>
    <div class="tabelwrap" style="margin-top:10px"><table>
      <tr><th>Speler</th><th>Score ploegmaats</th><th title="Gemiddelde van de eigen scores">Eigen score</th><th>MOTM</th>${P.ploeg.weak_link_aan ? "<th>Weak link</th>" : ""}<th></th></tr>
      ${rijen || '<tr><td colspan="7" class="leeg">Nog niemand opgesteld.</td></tr>'}
    </table></div>
  </div>
  <div class="raster twee" style="margin-top:14px">
    <div class="blok"><h2>De ploeg volgens de spelers</h2>
      <p style="margin:0">Mentaliteit: <b>${tel("team_mentaliteit")}</b> · Samenspel: <b>${tel("team_samenspel")}</b></p>
      ${waarom.length ? "<hr>" + waarom.map(([id, t]) => `<p style="margin:0 0 8px"><span class="wie">${esc(kortNaam(P.spelerMap[id]))}:</span> ${esc(t)}</p>`).join("") : ""}
    </div>
    <div class="blok"><h2>Tegenstander</h2>
      ${Object.keys(systemen).length ? `<p style="margin:0">Systeem: ${Object.entries(systemen).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<b>${esc(s)}</b> (${n})`).join(", ")}</p>` : '<p class="sub" style="margin:0">Nog geen antwoorden.</p>'}
      ${tegTekst.length ? "<hr>" + tegTekst.map(([id, a]) => `<p style="margin:0 0 8px"><span class="wie">${esc(kortNaam(P.spelerMap[id]))}:</span> ${a.teg_beste ? "beste speler: " + esc(a.teg_beste) : ""}${a.teg_beste && a.teg_extra ? " · " : ""}${esc(a.teg_extra || "")}</p>`).join("") : ""}
    </div>
  </div>
  <div id="evaldetail"></div>
  </div>`;
}

/* =====================================================================
   SPELER  (Home · Profiel · Voetbal · Wedstrijden · Kalender)
   ===================================================================== */
function mijnSpeler() { return P && P.lid && P.lid.speler_id && P.spelerMap ? P.spelerMap[P.lid.speler_id] : null; }
function mijnGroep(w, sid) { return (P.ploeg.groepen || []).find(g => ((w.opstelling || {})[g.id] || []).includes(sid)); }
async function laadFiche() {
  const ik = mijnSpeler();
  const prof = await q(sb.from("cs_speler_profiel").select("data").eq("speler_id", ik.id).maybeSingle());
  fiche = Object.assign({ sterk: {}, werk: {}, pos_fav: [], pos_meest: [], afwezig: [], gegevens: {} }, (prof && prof.data) || {});
  return fiche;
}

function vSpeler(tab, sub) {
  const ik = mijnSpeler();
  if (!ik) {
    app().innerHTML = ploegKop([["home", "Home"]], "home") + `<div class="melding geel">Je bent goedgekeurd, maar de coach heeft je account nog niet aan een speler gekoppeld. Vraag het even aan je coach.</div>
    <div class="rij" style="margin-top:14px"><button class="knop" onclick="herlaad()">Opnieuw kijken</button><button class="knop gevaar klein" onclick="A.verlaten()">Ploeg verlaten</button></div>`;
    return;
  }
  const tabs = [["home", "Home"], ["profiel", "Profiel"], ["voetbal", "Voetbal"], ["wedstrijden", "Wedstrijden"], ["kalender", "Kalender"]];
  const kop = ploegKop(tabs, tab);
  const views = { home: sHome, profiel: sProfiel, voetbal: sVoetbal, wedstrijden: sWedstrijden, kalender: sKalender };
  return (views[tab] || sHome)(kop, sub);
}

async function sHome(kop) {
  const ik = mijnSpeler();
  app().innerHTML = kop + '<div class="laden">Laden…</div>';
  const [mijnEvals] = await Promise.all([q(sb.from("cs_evaluaties").select("wedstrijd_id,ingediend").eq("speler_id", ik.id)), laadFiche()]);
  const nu = vandaag();
  const ingediend = new Set(mijnEvals.filter(e => e.ingediend).map(e => e.wedstrijd_id));
  const mijnMatchen = P.wedstrijden.filter(w => w.datum <= nu && mijnGroep(w, ik.id));
  const teDoen = mijnMatchen.filter(w => w.eval_open && !ingediend.has(w.id));
  const komend = P.wedstrijden.filter(w => w.datum >= nu).sort((a, b) => a.datum.localeCompare(b.datum))[0];
  const laatste = P.wedstrijden.filter(w => w.datum <= nu)[0];
  const g = komend && mijnGroep(komend, ik.id);
  const klaar = mijnMatchen.filter(w => ingediend.has(w.id)).length;
  app().innerHTML = kop + `
  <h1 class="titel" style="margin-top:0">Hallo <em>${esc(ik.voornaam)}</em>!</h1>
  ${teDoen.length ? `<div class="melding" style="margin:10px 0 14px"><b>⚠️ ${teDoen.length === 1 ? "1 evaluatie" : teDoen.length + " evaluaties"} in te vullen:</b><br>${teDoen.map(w => `<a href="#/p/${P.id}/wedstrijden/${w.id}">${esc(w.tegenstander)} (${datumMooi(w.datum, true)})</a>`).join(" · ")}</div>`
    : mijnMatchen.length ? '<div class="melding" style="margin:10px 0 14px;border-left-color:var(--live)"><b>Alle wedstrijdevaluaties ingevuld.</b> Goed bezig!</div>' : ""}
  ${!ficheIngevuld(fiche) ? `<div class="melding geel" style="margin-bottom:14px">Vul je <a href="#/p/${P.id}/voetbal">voetbalfiche</a> in, zodat je coach weet wat jij wil leren.</div>` : ""}
  <div class="raster twee">
    <div class="blok"><h2>📋 Mijn evaluaties</h2>
      <div class="cijfers"><div><b>${klaar}/${mijnMatchen.length}</b><span class="klein">ingevuld</span></div></div>
      <a class="knop klein" style="margin-top:12px" href="#/p/${P.id}/wedstrijden">Naar wedstrijden</a>
    </div>
    <div class="blok"><h2>Volgende wedstrijd</h2>
      ${komend ? `<p style="margin:0 0 4px;font-size:18px"><b>${esc(komend.tegenstander)}</b> <span class="label">${komend.thuis_uit}</span></p>
      <p class="sub" style="margin-bottom:6px">${datumMooi(komend.datum)}</p>
      ${g ? `<p style="margin:0"><span class="stip" style="background:${esc(g.kleur)}"></span> Je speelt bij <b>${esc(g.naam)}</b></p>` : '<p class="klein" style="margin:0">De opstelling is nog niet bekend.</p>'}`
      : '<p class="sub" style="margin:0">Nog geen wedstrijd gepland.</p>'}
    </div>
  </div>
  ${laatste && Object.keys(laatste.scores || {}).length ? `<div class="blok" style="margin-top:14px"><h2>Laatste uitslag</h2><p style="margin:0"><b>${esc(laatste.tegenstander)}</b> · ${datumMooi(laatste.datum, true)} ${scoreLabels(laatste)}</p></div>` : ""}`;
}

}
function tekenKalender() {
  const [j, m] = kalMaand, eerste = new Date(j, m, 1), dagen = new Date(j, m + 1, 0).getDate();
  const start = (eerste.getDay() + 6) % 7, nu = vandaag();
  let h = `<div class="rij tussen" style="margin-bottom:8px"><button type="button" class="knop klein" onclick="A.kalMaand(-1)" aria-label="Vorige maand">‹</button><b>${MAANDEN[m]} ${j}</b><button type="button" class="knop klein" onclick="A.kalMaand(1)" aria-label="Volgende maand">›</button></div><div class="kal">`;
  h += ["ma","di","wo","do","vr","za","zo"].map(d => `<div class="kop7">${d}</div>`).join("");
  for (let i = 0; i < start; i++) h += "<div></div>";
  for (let d = 1; d <= dagen; d++) {
    const iso = j + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const voorbij = iso < nu;
    h += `<div class="dag ${fiche.afwezig.includes(iso) ? "weg" : ""} ${voorbij ? "voorbij" : ""}" ${voorbij ? "" : `onclick="A.kalDag('${iso}',this)"`}>${d}</div>`;
  }
  $("#kal").innerHTML = h + "</div>";
}

/* Wedstrijden + evaluatie */
async function sWedstrijden(kop, sub) {
  const ik = mijnSpeler();
  if (sub) return sWedstrijd(kop, sub);
  const mijnEvals = await q(sb.from("cs_evaluaties").select("wedstrijd_id,ingediend").eq("speler_id", ik.id));
  const st = Object.fromEntries(mijnEvals.map(e => [e.wedstrijd_id, e.ingediend]));
  const nu = vandaag();
  const rij = w => {
    const g = mijnGroep(w, ik.id);
    let lab = "";
    if (w.datum <= nu && g && w.eval_open) lab = st[w.id] ? '<span class="label groen">ingevuld</span>' : '<span class="label geel">✏️ invullen</span>';
    else if (w.datum <= nu && !g) lab = '<span class="label">niet opgesteld</span>';
    return `<a class="item" href="#/p/${P.id}/wedstrijden/${w.id}">${datumBlok(w.datum)}
      <div class="hoofd"><b>${esc(w.tegenstander)}</b><span class="klein">${w.thuis_uit}${g ? " · " + esc(g.naam) : ""} ${scoreLabels(w)}</span></div>${lab}</a>`;
  };
  const komend = P.wedstrijden.filter(w => w.datum > nu).sort((a, b) => a.datum.localeCompare(b.datum));

async function sWedstrijd(kop, wid) {

    const motm = $("#motm") ? ($("#motm").value || null) : null, wl = $("#wl") ? ($("#wl").value || null) : null;
    try {
      await q(sb.from("cs_evaluaties").upsert({ wedstrijd_id: wid, ploeg_id: P.id, speler_id: ik.id, antwoorden, ratings, motm, weak_link: wl, ingediend: !!indienen }, { onConflict: "wedstrijd_id,speler_id" }));
      window._bewerk = false;
      toast(indienen ? "Evaluatie ingediend. Bedankt!" : "Concept bewaard");
      route();
    } catch (e) { foutMelding(e); }
  },
  async profielBewaar() {
    fiche.gegevens = leesGegevens(fiche.gegevens);
    try { await bewaarFiche("Profiel opgeslagen"); } catch (e) { foutMelding(e); }
  },
  async voetbalBewaar() {
    document.querySelectorAll("[data-multi]").forEach(el => fiche[el.dataset.multi] = [...el.querySelectorAll(".pill.aan")].map(b => b.textContent));
    const voet = document.querySelector('[data-keuze-vb="voet"] .pill.aan'); fiche.voet = voet ? voet.textContent : "";
    document.querySelectorAll("[data-vb]").forEach(el => { const v = el.value.trim(); if (v) fiche[el.dataset.vb] = v; else delete fiche[el.dataset.vb]; });
    document.querySelectorAll("[data-zb]").forEach(el => { const b = el.querySelector(".aan"); if (b) fiche[el.dataset.zb] = Number(b.textContent); else delete fiche[el.dataset.zb]; });
    fiche.sterk = {}; fiche.werk = {};
    document.querySelectorAll("[data-cat]").forEach(el => { const [soort, cat] = el.dataset.cat.split(":"); const k = [...el.querySelectorAll(".pill.aan")].map(b => b.textContent); if (k.length) fiche[soort][cat] = k; });
    try { await bewaarFiche("Voetbalfiche opgeslagen"); } catch (e) { foutMelding(e); }
  },
  kalMaand(d) { let [j, m] = kalMaand; m += d; if (m < 0) { m = 11; j--; } if (m > 11) { m = 0; j++; } kalMaand = [j, m]; tekenKalender(); },
  kalDag(iso, el) { const l = fiche.afwezig, i = l.indexOf(iso); if (i >= 0) l.splice(i, 1); else l.push(iso); el.classList.toggle("weg", i < 0); },
  async kalenderBewaar() {
    fiche.afwezig = fiche.afwezig.filter(x => x >= vandaag()).sort();
    try { await bewaarFiche("Kalender opgeslagen"); } catch (e) { foutMelding(e); }
  }
};
Object.assign(window, { ga, herlaad, route, deelLink });

sb.auth.onAuthStateChange((event, s) => {
  sessie = s;
  if (event === "PASSWORD_RECOVERY") { ga("#/nieuw-wachtwoord"); return; }
  if (event === "SIGNED_OUT") { P = null; mijnLeden = []; route(); }
});
sb.auth.getSession().then(({ data }) => { sessie = data.session; route(); });
</script>
