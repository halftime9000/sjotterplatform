:root{--acc:#6FD6B0;--canvas:#0F2A2E;--kaart:#15393F;--mist:#B4C8CA}

body{margin:0;min-height:100vh;background:var(--canvas);color:#fff;font:400 16px/1.55 'Exo 2',system-ui,sans-serif;display:flex;flex-direction:column}

.merk{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:900;font-style:italic;font-size:22px}
.merk .o1{fill:#fff}.merk .o2{fill:var(--canvas)}

h1{margin:4px 0 10px;font-size:40px;font-style:italic;font-weight:800;letter-spacing:-.03em}
p{color:var(--mist);margin:0 auto 24px;max-width:420px}
.rij{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pil{display:inline-flex;align-items:center;border-radius:80px;padding:12px 22px;font-weight:700;font-size:14px;text-decoration:none;background:#fff;color:#000}
.pil:hover{background:var(--acc)}
.spook{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:11px 14px;font-size:14px;text-decoration:none}
.pil,.spook{transform:skewX(-10deg);border-radius:6px!important;font-style:italic;font-weight:800!important}
/* Knoppen: schuin zoals de hub */
.pil,.spook{transform:skewX(-10deg);border-radius:6px!important;font-style:italic;font-weight:800!important}
